<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPA Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="bg-grid"></div>

  <header class="app-header">
    <div class="logo">
      <svg class="logo-icon" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="12" y="1" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="1" y="12" width="9" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <rect x="12" y="12" width="9" height="9" rx="2" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="logo-text">GPA Calculator</span>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="app-main">

    <!-- Summary Cards -->
    <section class="summary-bar">
      <div class="summary-card">
        <span class="card-label">SEMESTERS</span>
        <span class="card-value" id="totalSems">0</span>
      </div>
      <div class="summary-card highlight">
        <span class="card-label">CGPA</span>
        <span class="card-value" id="cgpaDisplay">—</span>
      </div>
      <div class="summary-card">
        <span class="card-label">TOTAL CREDITS</span>
        <span class="card-value" id="totalCreditsDisplay">—</span>
      </div>
    </section>

    <!-- Semesters Container -->
    <section class="semesters-section">
      <div id="semestersContainer"></div>

      <button class="add-sem-btn" id="addSemBtn">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="8" y1="2" x2="8" y2="14"/>
          <line x1="2" y1="8" x2="14" y2="8"/>
        </svg>
        <span>Add Semester</span>
      </button>
    </section>

    <!-- Calculate Button -->
    <div class="action-row">
      <button class="calc-btn" id="calculateAllBtn">
        <span class="calc-btn-inner">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
          </svg>
          Calculate CGPA &amp; All SGPAs
        </span>
      </button>
    </div>

    <!-- Results Panel -->
    <section class="results-panel" id="resultsPanel">
      <div class="results-header">
        <span class="results-title">OUTPUT</span>
        <button class="clear-btn" id="clearResultsBtn">CLEAR</button>
      </div>
      <div id="resultsContent"></div>
    </section>

  </main>

  <!-- Grade Reference Button -->
  <button class="grade-ref-btn" id="gradeRefBtn" title="Grade Reference">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </button>

  <!-- Grade Reference Modal -->
  <div class="modal-overlay" id="gradeModal">
    <div class="modal">
      <div class="modal-header">
        <span>GRADE REFERENCE</span>
        <button class="modal-close" id="modalClose">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="1" y1="1" x2="13" y2="13"/>
            <line x1="13" y1="1" x2="1" y2="13"/>
          </svg>
        </button>
      </div>
      <div class="grade-table">
        <div class="grade-row header">
          <span>GRADE</span><span>POINTS</span>
        </div>
        <div class="grade-row"><span>S</span><span>10.0</span></div>
        <div class="grade-row"><span>A+</span><span>9.0</span></div>
        <div class="grade-row"><span>A</span><span>8.5</span></div>
        <div class="grade-row"><span>B+</span><span>8.0</span></div>
        <div class="grade-row"><span>B</span><span>7.5</span></div>
        <div class="grade-row"><span>C+</span><span>7.0</span></div>
        <div class="grade-row"><span>C</span><span>6.5</span></div>
        <div class="grade-row"><span>D</span><span>6.0</span></div>
        <div class="grade-row"><span>P</span><span>5.5</span></div>
        <div class="grade-row fail"><span>F</span><span>0.0</span></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
